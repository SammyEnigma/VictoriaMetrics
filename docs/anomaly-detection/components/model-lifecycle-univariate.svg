<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1920 1295"><title id="title">Univariate models lifecycle</title><desc id="description">MetricsQL queries retrieve multiple series from VictoriaMetrics. Reader data fits one model per series in the model registry. Known series produce individual anomaly scores for Writer; an unseen series is skipped until a fitted model exists. Writer stores produced scores in VictoriaMetrics.</desc><defs><marker id="arrow" markerHeight="16" markerUnits="userSpaceOnUse" markerWidth="16" orient="auto-start-reverse" refX="10.5" refY="6" viewBox="0 0 12 12"><path fill="none" stroke="#303038" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M1.5 1.5 10.5 6 1.5 10.5"/></marker><marker id="arrow-blue" markerHeight="16" markerUnits="userSpaceOnUse" markerWidth="16" orient="auto-start-reverse" refX="10.5" refY="6" viewBox="0 0 12 12"><path fill="none" stroke="#1478c9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M1.5 1.5 10.5 6 1.5 10.5"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#303038}.node,.title{font-weight:400}.title{font-size:50px}.node{font-size:34px}.label{font-size:29px}.blue-label{font-size:26px}.small{font-size:25px}.box,.group{fill:#fff}.box,.group,.line,.model-group{stroke:#303038;stroke-width:3}.model-group{fill:#fff;stroke-dasharray:14 12}.line{fill:none;marker-end:url(#arrow)}.blue-line{fill:none;stroke:#1478c9;stroke-width:4;marker-end:url(#arrow-blue)}.blue{fill:#1478c9}</style></defs><rect width="1920" height="1295" fill="#fff"/><text x="20" y="70" class="title">Univariate Models Lifecycle</text><rect width="420" height="215" x="535" y="175" class="box"/><text x="745" y="265" class="node" text-anchor="middle">VictoriaMetrics TSDB</text><text x="745" y="310" class="node" text-anchor="middle">(Single-Node or Cluster)</text><rect width="150" height="155" x="270" y="270" class="box"/><text x="345" y="305" class="small" text-anchor="middle">Config.yml</text><text x="285" y="360" class="label">MetricsQL</text><text x="285" y="395" class="label">queries</text><path d="M420 346 H535" class="line"/><rect width="310" height="100" x="580" y="500" class="box"/><text x="735" y="562" class="node" text-anchor="middle">Reader</text><path d="M580 545 H455 V365 H535" class="line"/><text x="465" y="478" class="label">1. Request data</text><path d="M955 270 H1040 V550 H890" class="line"/><text x="810" y="478" class="label">2. Get metrics</text><g aria-label="Historical fit data"><rect width="430" height="505" x="1090" y="85" class="group"/><rect width="340" height="170" x="1120" y="135" class="group"/><text x="1140" y="180" class="node">Query 1</text><rect width="300" height="42" x="1135" y="195" class="box"/><text x="1150" y="228" class="label">Metric 1.1</text><text x="1150" y="262" class="label">...</text><rect width="300" height="42" x="1135" y="265" class="box"/><text x="1150" y="298" class="label">Metric 1.M₁</text><text x="1305" y="355" class="node" text-anchor="middle">...</text><rect width="340" height="170" x="1120" y="390" class="group"/><text x="1140" y="435" class="node">Query N</text><rect width="300" height="42" x="1135" y="450" class="box"/><text x="1150" y="483" class="label">Metric N.1</text><text x="1150" y="517" class="label">...</text><rect width="300" height="42" x="1135" y="520" class="box"/><text x="1150" y="553" class="label">Metric N.Mₙ</text></g><rect width="310" height="115" x="1215" y="795" class="box"/><text x="1370" y="865" class="node" text-anchor="middle">Model</text><rect width="155" height="130" x="1365" y="635" class="box"/><text x="1443" y="675" class="small" text-anchor="middle">Config.yml</text><text x="1382" y="723" class="label">Model</text><text x="1382" y="757" class="label">config</text><path d="M1305 590 V795" class="line"/><text x="1055" y="672" class="label"><tspan x="1055" dy="0">3. Fit models</tspan> <tspan x="1055" dy="38">on historical data</tspan></text><path d="M1443 765 V795" class="line"/><g aria-label="Inference data"><rect width="430" height="500" x="25" y="615" class="group"/><rect width="340" height="170" x="55" y="645" class="group"/><text x="75" y="690" class="node">Query 1 (has fit model)</text><rect width="300" height="42" x="70" y="705" class="box"/><text x="85" y="738" class="label">Metric 1.1</text><text x="85" y="772" class="label">...</text><rect width="300" height="42" x="70" y="775" class="box"/><text x="85" y="808" class="label">Metric 1.M₁</text><text x="225" y="870" class="node" text-anchor="middle">...</text><rect width="340" height="175" x="55" y="900" class="group"/><text x="75" y="945" class="node">Query N</text><rect width="300" height="42" x="70" y="960" class="box"/><text x="85" y="993" class="label">Metric N.1</text><text x="85" y="1027" class="label">...</text><rect width="300" height="42" x="70" y="1030" fill="#fff" stroke="#1478c9" stroke-width="4"/><text x="85" y="1063" class="label blue">Metric N.Mₖ</text></g><path d="M580 575 H500 V650 H455" class="line"/><text x="465" y="680" class="label">4. Provide inference data</text><g aria-label="Univariate model registry"><rect width="420" height="480" x="580" y="750" class="group"/><text x="790" y="800" class="node" text-anchor="middle">Model registry</text><rect width="360" height="170" x="610" y="830" class="model-group"/><rect width="300" height="42" x="630" y="865" class="box"/><text x="645" y="898" class="label">Model 1.1</text><text x="645" y="932" class="label">...</text><rect width="300" height="42" x="630" y="935" class="box"/><text x="645" y="968" class="label">Model 1.M₁</text><text x="790" y="1045" class="node" text-anchor="middle">...</text><rect width="360" height="135" x="610" y="1070" class="model-group"/><rect width="300" height="42" x="630" y="1090" class="box"/><text x="645" y="1123" class="label">Model N.1</text><rect width="300" height="42" x="630" y="1145" class="box"/><text x="645" y="1178" class="label">Model N.Mₙ</text></g><path d="M455 1050 H580" class="line"/><path d="M1215 852 H1000" class="line"/><rect width="285" height="105" x="1600" y="1015" class="box"/><text x="1743" y="1080" class="node" text-anchor="middle">Writer</text><rect width="145" height="145" x="1740" y="805" class="box"/><text x="1813" y="845" class="small" text-anchor="middle">Config.yml</text><text x="1758" y="900" class="label">Writer</text><text x="1758" y="935" class="label">config</text><path d="M1813 950 V1015" class="line"/><path d="M1000 1040 H1600" class="line"/><text x="1275" y="975" class="label" text-anchor="middle"><tspan x="1275" dy="0">5.a Produce anomaly scores</tspan> <tspan x="1275" dy="38">for known series</tspan></text><path d="M1000 1110 H1600" class="blue-line"/><text x="1320" y="1145" class="blue-label blue" text-anchor="middle"><tspan x="1320" dy="0">5.b Skip inference until a fitted model exists</tspan> <tspan x="1320" dy="32">for Metric N.Mₖ;</tspan> <tspan x="1320" dy="32">update the model_runs_skipped counter</tspan></text><path d="M1743 1015 V80 H745 V175" class="line"/><text x="1130" y="55" class="label" text-anchor="middle">6. Write back produced anomaly scores</text></svg>