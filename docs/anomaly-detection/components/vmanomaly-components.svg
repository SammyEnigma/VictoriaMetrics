<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1920 1600"><title id="title">How vmanomaly operates during a scheduled iteration</title><desc id="description">The required flow starts from config.yml and the Scheduler. The Reader queries either VictoriaMetrics through query_range or VictoriaLogs and VictoriaTraces through stats_query_range, then sends data to a Model. The Model produces anomaly scores, and the Writer stores them in VictoriaMetrics through import. Reader, Model, and Writer can optionally report self-monitoring metrics using push or pull monitoring.</desc><defs><marker id="arrow" markerHeight="16" markerUnits="userSpaceOnUse" markerWidth="16" orient="auto-start-reverse" refX="10.5" refY="6" viewBox="0 0 12 12"><path fill="none" stroke="#303038" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M1.5 1.5 10.5 6 1.5 10.5"/></marker><marker id="arrow-optional" markerHeight="16" markerUnits="userSpaceOnUse" markerWidth="16" orient="auto-start-reverse" refX="10.5" refY="6" viewBox="0 0 12 12"><path fill="none" stroke="#666a73" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M1.5 1.5 10.5 6 1.5 10.5"/></marker><style>.label{font-family:Arial,Helvetica,sans-serif;fill:#303038}.service-title,.title{font-weight:400}.title{font-size:54px}.service-title{font-size:46px}.node-text{font-size:34px;font-weight:600;text-anchor:middle}.body{font-size:28px}.edge-label{font-size:25px}.endpoint-text{font-size:23px}.source-text{font-size:21px}.optional-node,.required-node{fill:#fff;stroke-width:4}.required-node{stroke:#303038}.optional-node{stroke:#666a73;stroke-dasharray:14 12}.optional-line,.required-line{fill:none;stroke-width:4}.required-line{stroke:#303038;marker-end:url(#arrow)}.optional-line{stroke:#666a73;stroke-dasharray:14 12;marker-end:url(#arrow-optional)}.boundary,.optional-boundary{fill:none;stroke:#303038;stroke-width:4}.optional-boundary{stroke:#666a73;stroke-dasharray:14 12}</style></defs><rect width="1920" height="1600" fill="#fff"/><text x="105" y="72" class="label title">How does vmanomaly operate (scheduled iteration example)</text><g aria-label="Legend" transform="translate(1425 145)"><rect width="135" height="62" x="0" y="0" class="optional-node"/><rect width="135" height="62" x="205" y="0" class="required-node"/><path d="M0 100 H135" class="optional-line"/><path d="M205 100 H340" class="required-line"/><text x="67" y="162" class="label body" text-anchor="middle">Optional</text><text x="272" y="162" class="label body" text-anchor="middle">Required</text></g><g aria-label="Configured datasource choice"><rect width="300" height="550" x="25" y="315" class="optional-boundary"/><g transform="translate(34 326)"><path d="M8 32 V184 C8 224 280 224 280 184 V32 C280 70 8 70 8 32Z" class="required-node"/><ellipse cx="144" cy="32" class="required-node" rx="136" ry="33"/><rect width="228" height="66" x="30" y="72" class="required-node" rx="16"/><text x="144" y="99" class="label endpoint-text" text-anchor="middle">/query_range</text><text x="144" y="126" class="label endpoint-text" text-anchor="middle">endpoint</text><text x="144" y="158" class="label source-text" text-anchor="middle">VictoriaMetrics</text><text x="144" y="182" class="label source-text" text-anchor="middle">TSDB</text></g><text x="178" y="600" class="label body" text-anchor="middle">OR</text><g transform="translate(34 632)"><path d="M8 32 V184 C8 224 280 224 280 184 V32 C280 70 8 70 8 32Z" class="required-node"/><ellipse cx="144" cy="32" class="required-node" rx="136" ry="33"/><rect width="228" height="66" x="30" y="72" class="required-node" rx="16"/><text x="144" y="99" class="label endpoint-text" text-anchor="middle">/stats_query_range</text><text x="144" y="126" class="label endpoint-text" text-anchor="middle">endpoint</text><text x="144" y="158" class="label source-text" text-anchor="middle">VictoriaLogs /</text><text x="144" y="182" class="label source-text" text-anchor="middle">VictoriaTraces</text></g></g><g aria-label="vmanomaly service"><rect width="610" height="1145" x="720" y="145" class="boundary"/><rect width="270" height="100" x="1005" y="175" class="required-node"/><text x="1140" y="235" class="label node-text">config.yml</text><text x="1025" y="352" class="label service-title" text-anchor="middle">vmanomaly</text><text x="1025" y="405" class="label service-title" text-anchor="middle">service</text><rect width="445" height="76" x="765" y="448" class="required-node" rx="16"/><text x="987" y="500" class="label node-text">Scheduler</text><rect width="445" height="76" x="765" y="590" class="required-node" rx="16"/><text x="987" y="642" class="label node-text">Reader</text><rect width="445" height="76" x="765" y="732" class="required-node" rx="16"/><text x="987" y="784" class="label node-text">Model</text><rect width="445" height="76" x="765" y="874" class="required-node" rx="16"/><text x="987" y="926" class="label node-text">Writer</text><rect width="420" height="82" x="778" y="1180" class="optional-node" rx="16"/><text x="988" y="1235" class="label node-text">Monitoring</text><path d="M1005 225 H900 V448" class="required-line"/><path d="M1210 486 H1290 V628 H1210" class="required-line"/><path d="M1210 628 H1290 V770 H1210" class="required-line"/><path d="M1210 770 H1290 V912 H1210" class="required-line"/><path d="M875 666 V1178" class="optional-line"/><path d="M987 808 V1178" class="optional-line"/><path d="M1100 950 V1178" class="optional-line"/></g><text x="1365" y="455" class="label body"><tspan x="1365" dy="0">1. Get the metrics to</tspan> <tspan x="1365" dy="37">a. fit the model, or</tspan> <tspan x="1365" dy="37">b. produce anomaly scores</tspan></text><text x="1365" y="620" class="label body"><tspan x="1365" dy="0">3. Model receives data</tspan> <tspan x="1365" dy="37">to train or infer on</tspan></text><text x="1365" y="775" class="label body"><tspan x="1365" dy="0">4. Produce anomaly</tspan> <tspan x="1365" dy="37">scores (inference)</tspan></text><path d="M765 610 H338" class="required-line"/><path d="M338 652 H765" class="required-line"/><text x="370" y="580" class="label edge-label">2.1 Query request</text><text x="370" y="700" class="label edge-label">2.2 Metrics response</text><g aria-label="VictoriaMetrics write endpoint" transform="translate(26 1145)"><path d="M8 32 V184 C8 224 290 224 290 184 V32 C290 70 8 70 8 32Z" class="required-node"/><ellipse cx="149" cy="32" class="required-node" rx="141" ry="33"/><rect width="230" height="66" x="34" y="72" class="required-node" rx="16"/><text x="149" y="99" class="label endpoint-text" text-anchor="middle">/import</text><text x="149" y="126" class="label endpoint-text" text-anchor="middle">endpoint</text><text x="149" y="158" class="label source-text" text-anchor="middle">VictoriaMetrics</text><text x="149" y="182" class="label source-text" text-anchor="middle">TSDB</text></g><path d="M765 912 H650 V1095 L316 1197" class="required-line"/><rect width="292" height="74" x="338" y="1018" fill="#fff"/><text x="350" y="1048" class="label edge-label"><tspan x="340" dy="0">5. Write anomaly scores</tspan> <tspan x="340" dy="33">to VictoriaMetrics</tspan></text><rect width="490" height="48" x="748" y="1083" fill="#fff"/><text x="993" y="1116" class="label edge-label" text-anchor="middle">6. Produce self-monitoring metrics</text><rect width="300" height="118" x="390" y="1460" class="optional-node" rx="45"/><text x="540" y="1515" class="label body" text-anchor="middle">Monitoring system</text><text x="540" y="1552" class="label body" text-anchor="middle">push approach</text><rect width="300" height="118" x="1490" y="1460" class="optional-node" rx="45"/><text x="1640" y="1515" class="label body" text-anchor="middle">Monitoring system</text><text x="1640" y="1552" class="label body" text-anchor="middle">pull approach</text><path d="M850 1262 L540 1460" class="optional-line"/><path d="M1198 1222 L1640 1460" class="optional-line"/><rect width="180" height="42" x="590" y="1350" fill="#fff"/><text x="680" y="1380" class="label edge-label" text-anchor="middle">Push metrics</text><rect width="415" height="42" x="1230" y="1340" fill="#fff"/><text x="1438" y="1370" class="label edge-label" text-anchor="middle">HTTP GET /metrics or /health</text></svg>